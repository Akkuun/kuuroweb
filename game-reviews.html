<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Physical Video Game Reviews — Akkuunamatata</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      overflow: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .archive-page {
      width: 100%;
      max-width: 700px;
    }

    .archive-back {
      display: inline-block;
      margin-bottom: 10px;
      font-size: 11px;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="archive-page">
    <a class="archive-back" href="index.html">&larr; back to site</a>

    <div class="block" id="block-game-archive">
      <h2>ALL PHYSICAL VIDEO GAME REVIEWS <span class="jp">ゲームレビュー全部</span></h2>
      <div id="archive-list"></div>
    </div>
  </div>

  <script src="js/context-menu.js" defer></script>
  <script src="js/ascii-decor.js" defer></script>
  <script src="js/glitch.js" defer></script>
  <script src="js/archive.js"></script>
  <script>
    renderArchive({
      dataPath: "data/game/data.json",
      field: "all_reviews",
      imageKey: "cover",
      container: "archive-list",
    }).catch((err) => console.error(err));
  </script>
</body>
</html>
