<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Film Reviews — Akkuunamatata</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      overflow: auto;
      padding: 78px 20px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .archive-page {
      width: 100%;
      max-width: 700px;
    }

    .archive-back {
      display: inline-block;
      margin-bottom: 10px;
      font-size: 11px;
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- mur de gif, codé en dur (pas de script) : voir .eye-deco* dans style.css -->
  <img class="eye-deco eye-deco-l1" src="data/eye_wall.gif" alt="" aria-hidden="true">
  <img class="eye-deco eye-deco-l2" src="data/eye_wall.gif" alt="" aria-hidden="true">
  <img class="eye-deco eye-deco-l3" src="data/eye_wall.gif" alt="" aria-hidden="true">
  <img class="eye-deco eye-deco-l4" src="data/eye_wall.gif" alt="" aria-hidden="true">
  <img class="eye-deco eye-deco-l5" src="data/eye_wall.gif" alt="" aria-hidden="true">
  <img class="eye-deco eye-deco-r1" src="data/eye_wall.gif" alt="" aria-hidden="true">
  <img class="eye-deco eye-deco-r2" src="data/eye_wall.gif" alt="" aria-hidden="true">
  <img class="eye-deco eye-deco-r3" src="data/eye_wall.gif" alt="" aria-hidden="true">
  <img class="eye-deco eye-deco-r4" src="data/eye_wall.gif" alt="" aria-hidden="true">
  <img class="eye-deco eye-deco-r5" src="data/eye_wall.gif" alt="" aria-hidden="true">

  <!-- Bande supérieure : même bandeau que la page principale, pour un style cohérent -->
  <div id="marquee-bar">
    <div class="marquee-content" id="marquee-content"></div>
  </div>

  <div class="archive-page">
    <a class="archive-back" href="index.html">&larr; back to site</a>

    <div class="block" id="block-film-archive">
      <h2>ALL FILM REVIEWS <span class="jp">映画レビュー全部</span></h2>
      <div id="archive-list"></div>
    </div>
  </div>

  <script src="js/marquee.js" defer></script>
  <script src="js/context-menu.js" defer></script>
  <script src="js/ascii-decor.js" defer></script>
  <script src="js/glitch.js" defer></script>
  <script src="js/cursor-effects.js" defer></script>
  <script src="js/archive.js"></script>
  <script>
    renderArchive({
      dataPath: "data/film/data.json",
      field: "all_reviews",
      imageKey: "image",
      container: "archive-list",
    }).catch((err) => console.error(err));
  </script>
</body>
</html>
